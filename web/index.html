<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="陪练本 — 孩子上外教课，家长记下这节课的词和句子，一课一份课后陪练"
    />
    <meta name="theme-color" content="#1f7a6c" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="陪练本" />
    <meta name="format-detection" content="telephone=no" />
    <title>陪练本 · 家长课后陪练</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,550;9..144,650&family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@600&family=Source+Sans+3:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="boot" class="boot" aria-hidden="true">
      <div class="boot-mark">陪练本</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      window.addEventListener('load', () => {
        const boot = document.getElementById('boot')
        if (!boot) return
        requestAnimationFrame(() => boot.classList.add('is-done'))
      })
    </script>
  </body>
</html>
