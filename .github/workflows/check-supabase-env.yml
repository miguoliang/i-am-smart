# Reports whether Vite Supabase secrets exist. Never prints secret values.
name: Check Supabase env

on:
  pull_request:
  workflow_dispatch:

jobs:
  repository-secrets:
    name: Repository Actions secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check VITE_SUPABASE_* presence
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          echo "VITE_SUPABASE_URL: $( [ -n "$URL" ] && echo present || echo MISSING ) (len=${#URL})"
          echo "VITE_SUPABASE_ANON_KEY: $( [ -n "$KEY" ] && echo present || echo MISSING ) (len=${#KEY})"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Add Repository secrets (not Environment secrets): Settings → Secrets and variables → Actions → Repository secrets"
            echo "::error::Names must be exactly VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY"
            exit 1
          fi
          if [[ "$URL" == https://*.supabase.co || "$URL" == https://*.supabase.co/ ]]; then
            echo "URL shape: ok"
          elif [[ "$URL" == https://*supabase.co* ]]; then
            echo "URL shape: ok"
          else
            echo "::warning::URL does not look like https://xxxx.supabase.co"
          fi

  production-environment:
    name: Production environment secrets
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Check Production env
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "Production VITE_SUPABASE_URL: $( [ -n "$URL" ] && echo present || echo MISSING ) (len=${#URL})"
          echo "Production VITE_SUPABASE_ANON_KEY: $( [ -n "$KEY" ] && echo present || echo MISSING ) (len=${#KEY})"
