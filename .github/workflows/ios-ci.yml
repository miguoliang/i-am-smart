name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build and test
        run: |
          xcodebuild -scheme ShankaHero \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath DerivedData \
            build test
