# 构建并部署到指定服务器（SSH + 解压 + 重启）
# 所需 Secrets 见下方说明；服务器需预先安装 Node 并配置进程管理（如 pm2）
name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

env:
  DEPLOY_TARBALL: deploy/standalone.tar.gz

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 若使用 Environment 级 Secrets/Variables，取消下一行并到 Settings → Environments 建 production
    # environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 敏感用 Secret，非敏感可用 Variable；同名时 Secret 优先
      - name: Create .env.supabase for build and runtime
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY || vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || vars.VAPID_SUBJECT }}
          NEXT_PUBLIC_BAIDU_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_BAIDU_ANALYTICS_ID || vars.NEXT_PUBLIC_BAIDU_ANALYTICS_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY=$NEXT_PUBLIC_VAPID_PUBLIC_KEY"
            echo "VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY"
            echo "VAPID_SUBJECT=$VAPID_SUBJECT"
            echo "NEXT_PUBLIC_BAIDU_ANALYTICS_ID=$NEXT_PUBLIC_BAIDU_ANALYTICS_ID"
            [ -n "$NEXT_PUBLIC_SITE_URL" ] && echo "NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL"
          } > .env.supabase

      - name: Install dependencies
        run: npm ci

      - name: Package standalone (Supabase env)
        run: npm run package:standalone:supabase

      - name: Use fixed tarball name for deploy
        run: |
          TARBALL=$(ls deploy/standalone-*.tar.gz 2>/dev/null | head -1)
          if [ -n "$TARBALL" ]; then cp "$TARBALL" ${{ env.DEPLOY_TARBALL }}; fi

      - name: Deploy tarball to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: "deploy/standalone.tar.gz"
          target: "/tmp"

      - name: Extract and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          script: |
            set -e
            DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            tar -xzf /tmp/standalone.tar.gz -C . --strip-components=1
            rm -f /tmp/standalone.tar.gz
            if command -v pm2 &>/dev/null; then
              pm2 restart be-it-forever 2>/dev/null || pm2 start server.js --name be-it-forever || true
            fi
            echo "Deploy done."