# Build, test, and deploy to server via SSH.
# 仅在推送 v* tag 时运行；合并 main、PR、手动 Run workflow 均不触发本 workflow。
# 同一套构建产物；运行时由 Host 区分预发/正式（preview.iamsmart.top → 预发，www.iamsmart.top → 正式）。
# PM2 be-it-forever（默认 PORT=3000，由反向代理按域名转发，如 Candy）。
# 本 job 使用 GitHub Environment「production」：请在仓库 Settings → Environments 创建同名环境并配置 Secrets/Variables。
name: Deploy to Server

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    environment: Production
    env:
      PACKAGE_NAME: ${{ github.event.repository.name }}
      # 部署目标：Secret 或 Variable 均可（路径、主机名通常用 Variables 即可）
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY || vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || vars.VAPID_SUBJECT }}
      NEXT_PUBLIC_BAIDU_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_BAIDU_ANALYTICS_ID || vars.NEXT_PUBLIC_BAIDU_ANALYTICS_ID }}
      NEXT_PUBLIC_BAIDU_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_BAIDU_SITE_VERIFICATION || vars.NEXT_PUBLIC_BAIDU_SITE_VERIFICATION }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
      WECHAT_OPEN_APP_ID: ${{ secrets.WECHAT_OPEN_APP_ID || vars.WECHAT_OPEN_APP_ID }}
      WECHAT_OPEN_APP_SECRET: ${{ secrets.WECHAT_OPEN_APP_SECRET }}
      NEXT_PUBLIC_WECHAT_OPEN_APP_ID: ${{ secrets.NEXT_PUBLIC_WECHAT_OPEN_APP_ID || vars.NEXT_PUBLIC_WECHAT_OPEN_APP_ID }}
      NEXT_PUBLIC_APP_ORIGIN: ${{ secrets.NEXT_PUBLIC_APP_ORIGIN || vars.NEXT_PUBLIC_APP_ORIGIN }}
      NEXT_PUBLIC_APPLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_APPLE_CLIENT_ID || vars.NEXT_PUBLIC_APPLE_CLIENT_ID }}
      WECHAT_PAY_MCH_ID: ${{ secrets.WECHAT_PAY_MCH_ID }}
      WECHAT_PAY_APP_ID: ${{ secrets.WECHAT_PAY_APP_ID }}
      WECHAT_PAY_MERCHANT_SERIAL_NO: ${{ secrets.WECHAT_PAY_MERCHANT_SERIAL_NO }}
      WECHAT_PAY_PRIVATE_KEY: ${{ secrets.WECHAT_PAY_PRIVATE_KEY }}
      WECHAT_PAY_API_V3_KEY: ${{ secrets.WECHAT_PAY_API_V3_KEY }}
      ALIPAY_APP_ID: ${{ secrets.ALIPAY_APP_ID }}
      ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
      ALIPAY_PUBLIC_KEY: ${{ secrets.ALIPAY_PUBLIC_KEY }}
      ALIPAY_GATEWAY: ${{ secrets.ALIPAY_GATEWAY }}
      ALIYUN_SMS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_SMS_ACCESS_KEY_ID }}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_SMS_ACCESS_KEY_SECRET }}
      ALIYUN_SMS_SIGN_NAME: ${{ secrets.ALIYUN_SMS_SIGN_NAME || vars.ALIYUN_SMS_SIGN_NAME }}
      ALIYUN_SMS_TEMPLATE_CODE: ${{ secrets.ALIYUN_SMS_TEMPLATE_CODE || vars.ALIYUN_SMS_TEMPLATE_CODE }}
      AUTH_HOOK_SECRET: ${{ secrets.AUTH_HOOK_SECRET }}
      TEST_PHONE_WHITELIST: ${{ secrets.TEST_PHONE_WHITELIST || vars.TEST_PHONE_WHITELIST }}
      TEST_OTP_CODE: ${{ secrets.TEST_OTP_CODE || vars.TEST_OTP_CODE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deploy target configuration
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::DEPLOY_HOST is empty. Add it under Settings → Secrets and variables → Actions (Repository **Secrets** or **Variables**, name DEPLOY_HOST)."
            exit 1
          fi
          if [ -z "$DEPLOY_USER" ]; then
            echo "::error::DEPLOY_USER is empty. Set Secret or Variable DEPLOY_USER."
            exit 1
          fi
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::DEPLOY_SSH_KEY is empty. Add the private SSH key under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          if [ -z "$DEPLOY_PATH" ]; then
            echo "::error::DEPLOY_PATH is empty. Set **Variable** or Secret DEPLOY_PATH (e.g. /var/www/i-am-smart). Prefer **Variables** — paths are not sensitive."
            exit 1
          fi
          echo "Deploy target: $DEPLOY_USER@$DEPLOY_HOST → $DEPLOY_PATH"

      - name: Lint
        run: pnpm --filter @i-am-smart/pwa run lint

      - name: Type check (pwa)
        run: pnpm --filter @i-am-smart/pwa run type-check

      - name: Test
        run: pnpm --filter @i-am-smart/pwa run test

      - name: Cache .next
        uses: actions/cache@v4
        with:
          path: apps/pwa/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/pwa/src/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm --filter @i-am-smart/pwa run build

      - name: Package
        run: |
          pkg=deploy/${{ env.PACKAGE_NAME }}
          mkdir -p "$pkg"
          cp -r apps/pwa/.next/standalone/. "$pkg/"
          cp -r apps/pwa/public "$pkg/apps/pwa/public"
          mkdir -p "$pkg/apps/pwa/.next"
          cp -r apps/pwa/.next/static "$pkg/apps/pwa/.next/static"
          tar -czf ${{ env.PACKAGE_NAME }}.tar.gz -C deploy ${{ env.PACKAGE_NAME }}

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          source: ${{ env.PACKAGE_NAME }}.tar.gz
          target: /tmp

      - name: Extract and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          envs: NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,NEXT_PUBLIC_VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT,NEXT_PUBLIC_BAIDU_ANALYTICS_ID,NEXT_PUBLIC_BAIDU_SITE_VERIFICATION,NEXT_PUBLIC_SITE_URL,WECHAT_OPEN_APP_ID,WECHAT_OPEN_APP_SECRET,NEXT_PUBLIC_WECHAT_OPEN_APP_ID,NEXT_PUBLIC_APP_ORIGIN,NEXT_PUBLIC_APPLE_CLIENT_ID,WECHAT_PAY_MCH_ID,WECHAT_PAY_APP_ID,WECHAT_PAY_MERCHANT_SERIAL_NO,WECHAT_PAY_PRIVATE_KEY,WECHAT_PAY_API_V3_KEY,ALIPAY_APP_ID,ALIPAY_PRIVATE_KEY,ALIPAY_PUBLIC_KEY,ALIPAY_GATEWAY,ALIYUN_SMS_ACCESS_KEY_ID,ALIYUN_SMS_ACCESS_KEY_SECRET,ALIYUN_SMS_SIGN_NAME,ALIYUN_SMS_TEMPLATE_CODE,AUTH_HOOK_SECRET,TEST_PHONE_WHITELIST,TEST_OTP_CODE
          script: |
            set -e
            DEPLOY_PATH='${{ env.DEPLOY_PATH }}'
            mkdir -p "$DEPLOY_PATH"
            rm -rf "$DEPLOY_PATH/node_modules" "$DEPLOY_PATH/.next" "$DEPLOY_PATH/apps"
            TARBALL=$(find /tmp -name '${{ env.PACKAGE_NAME }}.tar.gz' -type f 2>/dev/null | head -1)
            tar -xzf "$TARBALL" -C "$DEPLOY_PATH" --strip-components=1
            rm -f "$TARBALL"
            ENV_FILE="$DEPLOY_PATH/apps/pwa/.env"
            : > "$ENV_FILE"
            for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT NEXT_PUBLIC_BAIDU_ANALYTICS_ID NEXT_PUBLIC_BAIDU_SITE_VERIFICATION NEXT_PUBLIC_SITE_URL WECHAT_OPEN_APP_ID WECHAT_OPEN_APP_SECRET NEXT_PUBLIC_WECHAT_OPEN_APP_ID NEXT_PUBLIC_APP_ORIGIN NEXT_PUBLIC_APPLE_CLIENT_ID WECHAT_PAY_MCH_ID WECHAT_PAY_APP_ID WECHAT_PAY_MERCHANT_SERIAL_NO WECHAT_PAY_PRIVATE_KEY WECHAT_PAY_API_V3_KEY ALIPAY_APP_ID ALIPAY_PRIVATE_KEY ALIPAY_PUBLIC_KEY ALIPAY_GATEWAY ALIYUN_SMS_ACCESS_KEY_ID ALIYUN_SMS_ACCESS_KEY_SECRET ALIYUN_SMS_SIGN_NAME ALIYUN_SMS_TEMPLATE_CODE AUTH_HOOK_SECRET TEST_PHONE_WHITELIST TEST_OTP_CODE; do
              value="$(printenv "$v" || true)"
              [ -n "$value" ] && printf '%s=%s\n' "$v" "$value" >> "$ENV_FILE"
            done
            chmod 600 "$ENV_FILE"
            if command -v pm2 &>/dev/null; then
              cd "$DEPLOY_PATH/apps/pwa"
              PM2_NAME="be-it-forever"
              APP_PORT="3000"
              pm2 restart "$PM2_NAME" 2>/dev/null || PORT="$APP_PORT" pm2 start server.js --name "$PM2_NAME" || true
            fi
            echo "Deploy done."
