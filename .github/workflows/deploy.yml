# Build, test, and deploy to server via SSH.
# - Pull request → build + test only (no deploy).
# - Push to main → build + deploy to preview.
# - Push tag (v*) → build + deploy to production.
# - workflow_dispatch → build + deploy to preview.
name: Deploy to Server

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'preview' || (startsWith(github.ref, 'refs/tags/') && 'production' || 'preview') }}
    env:
      PACKAGE_NAME: ${{ github.event.repository.name }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY || vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || vars.VAPID_SUBJECT }}
      NEXT_PUBLIC_BAIDU_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_BAIDU_ANALYTICS_ID || vars.NEXT_PUBLIC_BAIDU_ANALYTICS_ID }}
      NEXT_PUBLIC_BAIDU_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_BAIDU_SITE_VERIFICATION || vars.NEXT_PUBLIC_BAIDU_SITE_VERIFICATION }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_APP_ENV: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'preview' }}
      WECHAT_OPEN_APP_ID: ${{ secrets.WECHAT_OPEN_APP_ID || vars.WECHAT_OPEN_APP_ID }}
      WECHAT_OPEN_APP_SECRET: ${{ secrets.WECHAT_OPEN_APP_SECRET }}
      NEXT_PUBLIC_WECHAT_OPEN_APP_ID: ${{ secrets.NEXT_PUBLIC_WECHAT_OPEN_APP_ID || vars.NEXT_PUBLIC_WECHAT_OPEN_APP_ID }}
      NEXT_PUBLIC_APP_ORIGIN: ${{ secrets.NEXT_PUBLIC_APP_ORIGIN || vars.NEXT_PUBLIC_APP_ORIGIN }}
      NEXT_PUBLIC_APPLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_APPLE_CLIENT_ID || vars.NEXT_PUBLIC_APPLE_CLIENT_ID }}
      WECHAT_PAY_MCH_ID: ${{ secrets.WECHAT_PAY_MCH_ID }}
      WECHAT_PAY_APP_ID: ${{ secrets.WECHAT_PAY_APP_ID }}
      WECHAT_PAY_MERCHANT_SERIAL_NO: ${{ secrets.WECHAT_PAY_MERCHANT_SERIAL_NO }}
      WECHAT_PAY_PRIVATE_KEY: ${{ secrets.WECHAT_PAY_PRIVATE_KEY }}
      WECHAT_PAY_API_V3_KEY: ${{ secrets.WECHAT_PAY_API_V3_KEY }}
      WECHAT_MINIPROGRAM_APP_ID: ${{ secrets.WECHAT_MINIPROGRAM_APP_ID }}
      WECHAT_MINIPROGRAM_APP_SECRET: ${{ secrets.WECHAT_MINIPROGRAM_APP_SECRET }}
      ALIPAY_APP_ID: ${{ secrets.ALIPAY_APP_ID }}
      ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
      ALIPAY_PUBLIC_KEY: ${{ secrets.ALIPAY_PUBLIC_KEY }}
      ALIPAY_GATEWAY: ${{ secrets.ALIPAY_GATEWAY }}
      ALIYUN_SMS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_SMS_ACCESS_KEY_ID }}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_SMS_ACCESS_KEY_SECRET }}
      ALIYUN_SMS_SIGN_NAME: ${{ secrets.ALIYUN_SMS_SIGN_NAME || vars.ALIYUN_SMS_SIGN_NAME }}
      ALIYUN_SMS_TEMPLATE_CODE: ${{ secrets.ALIYUN_SMS_TEMPLATE_CODE || vars.ALIYUN_SMS_TEMPLATE_CODE }}
      SUPABASE_AUTH_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_HOOK_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build miniprogram config
        env:
          ALLOW_MISSING_CONFIG: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: pnpm --filter @i-am-smart/pwa run build:miniprogram-config

      - name: Lint
        run: pnpm --filter @i-am-smart/pwa run lint

      - name: Type check (pwa)
        run: pnpm --filter @i-am-smart/pwa run type-check

      - name: Type check (miniprogram)
        run: pnpm --filter @i-am-smart/miniprogram run type-check

      - name: Test
        run: pnpm --filter @i-am-smart/pwa run test

      - name: Cache .next
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: apps/pwa/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/pwa/src/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        if: github.event_name != 'pull_request'
        run: pnpm --filter @i-am-smart/pwa run build

      - name: Package
        if: github.event_name != 'pull_request'
        run: |
          pkg=deploy/${{ env.PACKAGE_NAME }}
          mkdir -p "$pkg"
          cp -r apps/pwa/.next/standalone/. "$pkg/"
          cp -r apps/pwa/public "$pkg/apps/pwa/public"
          mkdir -p "$pkg/apps/pwa/.next"
          cp -r apps/pwa/.next/static "$pkg/apps/pwa/.next/static"
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT NEXT_PUBLIC_BAIDU_ANALYTICS_ID NEXT_PUBLIC_BAIDU_SITE_VERIFICATION NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_APP_ENV WECHAT_OPEN_APP_ID WECHAT_OPEN_APP_SECRET NEXT_PUBLIC_WECHAT_OPEN_APP_ID NEXT_PUBLIC_APP_ORIGIN NEXT_PUBLIC_APPLE_CLIENT_ID WECHAT_PAY_MCH_ID WECHAT_PAY_APP_ID WECHAT_PAY_MERCHANT_SERIAL_NO WECHAT_PAY_PRIVATE_KEY WECHAT_PAY_API_V3_KEY WECHAT_MINIPROGRAM_APP_ID WECHAT_MINIPROGRAM_APP_SECRET ALIPAY_APP_ID ALIPAY_PRIVATE_KEY ALIPAY_PUBLIC_KEY ALIPAY_GATEWAY ALIYUN_SMS_ACCESS_KEY_ID ALIYUN_SMS_ACCESS_KEY_SECRET ALIYUN_SMS_SIGN_NAME ALIYUN_SMS_TEMPLATE_CODE SUPABASE_AUTH_HOOK_SECRET; do [ -n "${!v}" ] && echo "$v=${!v}"; done > "$pkg/apps/pwa/.env"
          tar -czf /tmp/${{ env.PACKAGE_NAME }}.tar.gz -C deploy ${{ env.PACKAGE_NAME }}

      # Deploy directly via SCP + SSH (no artifact needed)
      - name: Deploy to server
        if: github.event_name != 'pull_request'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: /tmp/${{ env.PACKAGE_NAME }}.tar.gz
          target: /tmp
          strip_components: 1

      - name: Extract and restart
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          script: |
            set -e
            DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
            mkdir -p "$DEPLOY_PATH"
            rm -rf "$DEPLOY_PATH/node_modules" "$DEPLOY_PATH/.next" "$DEPLOY_PATH/apps"
            TARBALL=$(find /tmp -name '${{ env.PACKAGE_NAME }}.tar.gz' -type f 2>/dev/null | head -1)
            tar -xzf "$TARBALL" -C "$DEPLOY_PATH" --strip-components=1
            rm -f "$TARBALL"
            if command -v pm2 &>/dev/null; then
              cd "$DEPLOY_PATH/apps/pwa"
              PM2_NAME="${{ startsWith(github.ref, 'refs/tags/') && 'be-it-forever' || 'be-it-forever-preview' }}"
              APP_PORT="${{ startsWith(github.ref, 'refs/tags/') && '3000' || '3001' }}"
              pm2 restart "$PM2_NAME" 2>/dev/null || PORT="$APP_PORT" pm2 start server.js --name "$PM2_NAME" || true
            fi
            echo "Deploy done."
