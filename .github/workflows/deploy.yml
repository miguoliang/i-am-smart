# Build, package, and deploy to server via SSH.
# - Pull request → build only (no package, no deploy).
# - Push to main (after merge) → build + package → deploy-preview.
# - Push tag (e.g. v1.0.0) → build + package → deploy-production.
# - workflow_dispatch → build + package → deploy-preview.
# Configure Secrets/Variables in repo or in Environment (production / preview).
name: Deploy to Server

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    # PR: preview env for build; push tag → production, push main / dispatch → preview
    environment: ${{ github.event_name == 'pull_request' && 'preview' || (startsWith(github.ref, 'refs/tags/') && 'production' || 'preview') }}
    env:
      PACKAGE_NAME: ${{ github.event.repository.name }}
      DEPLOY_TARBALL: deploy/${{ github.event.repository.name }}.tar.gz
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY || vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || vars.VAPID_SUBJECT }}
      NEXT_PUBLIC_BAIDU_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_BAIDU_ANALYTICS_ID || vars.NEXT_PUBLIC_BAIDU_ANALYTICS_ID }}
      NEXT_PUBLIC_BAIDU_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_BAIDU_SITE_VERIFICATION || vars.NEXT_PUBLIC_BAIDU_SITE_VERIFICATION }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_APP_ENV: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'preview' }}
      WECHAT_OPEN_APP_ID: ${{ secrets.WECHAT_OPEN_APP_ID || vars.WECHAT_OPEN_APP_ID }}
      WECHAT_OPEN_APP_SECRET: ${{ secrets.WECHAT_OPEN_APP_SECRET }}
      NEXT_PUBLIC_WECHAT_OPEN_APP_ID: ${{ secrets.NEXT_PUBLIC_WECHAT_OPEN_APP_ID || vars.NEXT_PUBLIC_WECHAT_OPEN_APP_ID }}
      NEXT_PUBLIC_APP_ORIGIN: ${{ secrets.NEXT_PUBLIC_APP_ORIGIN || vars.NEXT_PUBLIC_APP_ORIGIN }}
      NEXT_PUBLIC_APPLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_APPLE_CLIENT_ID || vars.NEXT_PUBLIC_APPLE_CLIENT_ID }}
      WECHAT_PAY_MCH_ID: ${{ secrets.WECHAT_PAY_MCH_ID }}
      WECHAT_PAY_APP_ID: ${{ secrets.WECHAT_PAY_APP_ID }}
      WECHAT_PAY_MERCHANT_SERIAL_NO: ${{ secrets.WECHAT_PAY_MERCHANT_SERIAL_NO }}
      WECHAT_PAY_PRIVATE_KEY: ${{ secrets.WECHAT_PAY_PRIVATE_KEY }}
      WECHAT_PAY_API_V3_KEY: ${{ secrets.WECHAT_PAY_API_V3_KEY }}
      WECHAT_MINIPROGRAM_APP_ID: ${{ secrets.WECHAT_MINIPROGRAM_APP_ID }}
      WECHAT_MINIPROGRAM_APP_SECRET: ${{ secrets.WECHAT_MINIPROGRAM_APP_SECRET }}
      ALIPAY_APP_ID: ${{ secrets.ALIPAY_APP_ID }}
      ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
      ALIPAY_PUBLIC_KEY: ${{ secrets.ALIPAY_PUBLIC_KEY }}
      ALIPAY_GATEWAY: ${{ secrets.ALIPAY_GATEWAY }}
      ALIYUN_SMS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_SMS_ACCESS_KEY_ID }}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_SMS_ACCESS_KEY_SECRET }}
      ALIYUN_SMS_SIGN_NAME: ${{ secrets.ALIYUN_SMS_SIGN_NAME || vars.ALIYUN_SMS_SIGN_NAME }}
      ALIYUN_SMS_TEMPLATE_CODE: ${{ secrets.ALIYUN_SMS_TEMPLATE_CODE || vars.ALIYUN_SMS_TEMPLATE_CODE }}
      SUPABASE_AUTH_HOOK_SECRET: ${{ secrets.SUPABASE_AUTH_HOOK_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build miniprogram config
        env:
          ALLOW_MISSING_CONFIG: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        run: pnpm --filter @i-am-smart/pwa run build:miniprogram-config

      - name: Lint
        run: pnpm --filter @i-am-smart/pwa run lint

      - name: Type check (pwa)
        run: pnpm --filter @i-am-smart/pwa run type-check

      - name: Type check (miniprogram)
        run: pnpm --filter @i-am-smart/miniprogram run type-check

      - name: Test
        run: pnpm --filter @i-am-smart/pwa run test --runInBand

      - name: Cache .next
        uses: actions/cache@v4
        with:
          path: apps/pwa/.next
          key: next-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/pwa/**/*.ts', 'apps/pwa/**/*.tsx', 'apps/pwa/**/next.config.*') }}-${{ env.NEXT_PUBLIC_APP_ENV }}

      - name: Build
        run: pnpm --filter @i-am-smart/pwa run build

      - name: Package
        if: github.event_name != 'pull_request'
        run: |
          pkg=deploy/${{ env.PACKAGE_NAME }}
          mkdir -p "$pkg"
          # Monorepo standalone: server.js is under apps/pwa/ within standalone output
          cp -r apps/pwa/.next/standalone/apps/pwa/. "$pkg/"
          # Copy shared node_modules from standalone root
          cp -r apps/pwa/.next/standalone/node_modules "$pkg/node_modules"
          [ -d apps/pwa/.next/standalone/package.json ] && cp apps/pwa/.next/standalone/package.json "$pkg/" || true
          cp -r apps/pwa/public "$pkg/public"
          mkdir -p "$pkg/.next"
          cp -r apps/pwa/.next/static "$pkg/.next/static"
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT NEXT_PUBLIC_BAIDU_ANALYTICS_ID NEXT_PUBLIC_BAIDU_SITE_VERIFICATION NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_APP_ENV WECHAT_OPEN_APP_ID WECHAT_OPEN_APP_SECRET NEXT_PUBLIC_WECHAT_OPEN_APP_ID NEXT_PUBLIC_APP_ORIGIN NEXT_PUBLIC_APPLE_CLIENT_ID WECHAT_PAY_MCH_ID WECHAT_PAY_APP_ID WECHAT_PAY_MERCHANT_SERIAL_NO WECHAT_PAY_PRIVATE_KEY WECHAT_PAY_API_V3_KEY WECHAT_MINIPROGRAM_APP_ID WECHAT_MINIPROGRAM_APP_SECRET ALIPAY_APP_ID ALIPAY_PRIVATE_KEY ALIPAY_PUBLIC_KEY ALIPAY_GATEWAY ALIYUN_SMS_ACCESS_KEY_ID ALIYUN_SMS_ACCESS_KEY_SECRET ALIYUN_SMS_SIGN_NAME ALIYUN_SMS_TEMPLATE_CODE SUPABASE_AUTH_HOOK_SECRET; do [ -n "${!v}" ] && echo "$v=${!v}"; done > "$pkg/.env"
          tar -czf ${{ env.DEPLOY_TARBALL }} -C deploy ${{ env.PACKAGE_NAME }}

      - name: Upload tarball
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-tarball
          path: deploy/${{ env.PACKAGE_NAME }}.tar.gz

  deploy-preview:
    name: Deploy to Preview
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    environment: preview
    env:
      PACKAGE_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: deploy-tarball

      - name: Deploy tarball to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: ${{ env.PACKAGE_NAME }}.tar.gz
          target: "/tmp"

      - name: Extract and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          script: |
            set -e
            DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
            mkdir -p "$DEPLOY_PATH"
            rm -rf "$DEPLOY_PATH/node_modules" "$DEPLOY_PATH/.next"
            TARBALL=$(find /tmp -name '${{ env.PACKAGE_NAME }}.tar.gz' -type f 2>/dev/null | head -1)
            tar -xzf "$TARBALL" -C "$DEPLOY_PATH" --strip-components=1
            rm -rf /tmp/deploy /tmp/${{ env.PACKAGE_NAME }}.tar.gz 2>/dev/null || true
            if command -v pm2 &>/dev/null; then
              cd "$DEPLOY_PATH"
              pm2 restart be-it-forever-preview 2>/dev/null || PORT=3001 pm2 start server.js --name be-it-forever-preview || true
            fi
            echo "Deploy done."

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: production
    env:
      PACKAGE_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: deploy-tarball

      - name: Deploy tarball to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: ${{ env.PACKAGE_NAME }}.tar.gz
          target: "/tmp"

      - name: Extract and restart on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          script: |
            set -e
            DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
            mkdir -p "$DEPLOY_PATH"
            rm -rf "$DEPLOY_PATH/node_modules" "$DEPLOY_PATH/.next"
            TARBALL=$(find /tmp -name '${{ env.PACKAGE_NAME }}.tar.gz' -type f 2>/dev/null | head -1)
            tar -xzf "$TARBALL" -C "$DEPLOY_PATH" --strip-components=1
            rm -rf /tmp/deploy /tmp/${{ env.PACKAGE_NAME }}.tar.gz 2>/dev/null || true
            if command -v pm2 &>/dev/null; then
              cd "$DEPLOY_PATH"
              pm2 restart be-it-forever 2>/dev/null || PORT=3000 pm2 start server.js --name be-it-forever || true
            fi
            echo "Deploy done."
