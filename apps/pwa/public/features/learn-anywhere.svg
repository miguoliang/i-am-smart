<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="800" y2="450">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#FFF7ED"/>
    </linearGradient>
    <linearGradient id="phone1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="screen1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg1)" rx="0"/>
  
  <!-- Decorative circles -->
  <circle cx="650" cy="80" r="60" fill="#FDE68A" opacity="0.3"/>
  <circle cx="150" cy="380" r="40" fill="#93C5FD" opacity="0.3"/>
  <circle cx="700" cy="350" r="30" fill="#FCA5A5" opacity="0.2"/>
  
  <!-- Subway/train window shape -->
  <rect x="80" y="100" width="280" height="250" rx="30" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="95" y="115" width="250" height="180" rx="15" fill="#BFDBFE" opacity="0.5"/>
  <!-- City buildings through window -->
  <rect x="110" y="180" width="30" height="115" rx="3" fill="#94A3B8" opacity="0.4"/>
  <rect x="150" y="150" width="40" height="145" rx="3" fill="#94A3B8" opacity="0.5"/>
  <rect x="200" y="170" width="35" height="125" rx="3" fill="#94A3B8" opacity="0.35"/>
  <rect x="245" y="140" width="45" height="155" rx="3" fill="#94A3B8" opacity="0.45"/>
  <rect x="300" y="190" width="30" height="105" rx="3" fill="#94A3B8" opacity="0.3"/>
  <!-- Window handle -->
  <rect x="180" y="310" width="80" height="8" rx="4" fill="#94A3B8"/>
  
  <!-- Person's hand holding phone -->
  <!-- Hand -->
  <ellipse cx="500" cy="320" rx="55" ry="25" fill="#FBBF24" opacity="0.15" transform="rotate(-10, 500, 320)"/>
  
  <!-- Phone -->
  <rect x="440" y="120" width="140" height="260" rx="18" fill="url(#phone1)"/>
  <rect x="448" y="135" width="124" height="230" rx="10" fill="url(#screen1)"/>
  <!-- Phone notch -->
  <rect x="485" y="126" width="50" height="6" rx="3" fill="#475569"/>
  
  <!-- App content on phone -->
  <!-- Header bar -->
  <rect x="458" y="148" width="104" height="24" rx="6" fill="#3B82F6" opacity="0.9"/>
  <text x="510" y="164" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">English</text>
  
  <!-- Word card -->
  <rect x="462" y="182" width="96" height="55" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <text x="510" y="205" font-family="Arial, sans-serif" font-size="14" fill="#1E293B" text-anchor="middle" font-weight="bold">apple</text>
  <text x="510" y="225" font-family="Arial, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">?? ??</text>
  
  <!-- Progress bar -->
  <rect x="462" y="248" width="96" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="462" y="248" width="60" height="8" rx="4" fill="#FBBF24"/>
  
  <!-- Stats -->
  <text x="510" y="275" font-family="Arial, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">?? 12 / 20</text>
  
  <!-- Buttons -->
  <rect x="462" y="288" width="44" height="22" rx="6" fill="#EF4444" opacity="0.8"/>
  <text x="484" y="303" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">???</text>
  <rect x="514" y="288" width="44" height="22" rx="6" fill="#22C55E" opacity="0.8"/>
  <text x="536" y="303" font-family="Arial, sans-serif" font-size="8" fill="white" text-anchor="middle">??</text>
  
  <!-- Floating elements - clock, location pins -->
  <!-- Clock -->
  <circle cx="660" cy="160" r="35" fill="white" stroke="#FBBF24" stroke-width="3"/>
  <line x1="660" y1="160" x2="660" y2="140" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="660" y1="160" x2="675" y2="165" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="660" cy="160" r="3" fill="#FBBF24"/>
  
  <!-- Location pin -->
  <g transform="translate(660, 260)">
    <path d="M0-25C-14-25-25-14-25 0C-25 17 0 35 0 35S25 17 25 0C25-14 14-25 0-25Z" fill="#3B82F6" opacity="0.8"/>
    <circle cx="0" cy="-2" r="8" fill="white"/>
  </g>
  
  <!-- Coffee cup -->
  <g transform="translate(150, 80)">
    <rect x="-12" y="0" width="24" height="22" rx="3" fill="#92400E" opacity="0.7"/>
    <path d="M12 4 Q22 4 22 12 Q22 20 12 18" fill="none" stroke="#92400E" stroke-width="2" opacity="0.7"/>
    <path d="M-6 -5 Q-4 -12 -2 -5" fill="none" stroke="#94A3B8" stroke-width="1.5" opacity="0.5"/>
    <path d="M2 -5 Q4 -14 6 -5" fill="none" stroke="#94A3B8" stroke-width="1.5" opacity="0.5"/>
  </g>
</svg>
